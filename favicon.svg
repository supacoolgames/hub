<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    
    <radialGradient id="baseField" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#120f22" />
      <stop offset="0.6" stop-color="#0a0a12" />
      <stop offset="1" stop-color="#070710" />
    </radialGradient>

    
    <radialGradient id="warmGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(400,120) scale(520)">
      <stop offset="0" stop-color="#ff5fff" stop-opacity="0.34" />
      <stop offset="0.4" stop-color="#d75fd7" stop-opacity="0.14" />
      <stop offset="1" stop-color="#af5fff" stop-opacity="0" />
    </radialGradient>

    
    <radialGradient id="coolGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(400,700) scale(520)">
      <stop offset="0" stop-color="#00ffff" stop-opacity="0.28" />
      <stop offset="0.4" stop-color="#00d7ff" stop-opacity="0.12" />
      <stop offset="1" stop-color="#00afff" stop-opacity="0" />
    </radialGradient>

    
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M0 0 V48" stroke="#00d7ff" stroke-opacity="0.07" stroke-width="1" />
      <path d="M0 0 H48" stroke="#ff5fff" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0" />
      <stop offset="0.5" stop-color="#000" stop-opacity="0" />
      <stop offset="1" stop-color="#fff" stop-opacity="0.7" />
    </linearGradient>
    <mask id="floorMask"><rect width="800" height="800" fill="url(#floorFade)" /></mask>

    
    <clipPath id="disc"><circle cx="400" cy="400" r="400" /></clipPath>

    
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="1" fill="#000000" fill-opacity="0.15" />
      <rect x="0" y="2" width="4" height="1" fill="#00d7ff" fill-opacity="0.03" />
    </pattern>

    
    <linearGradient id="rampField" x1="0" y1="150" x2="0" y2="672" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5fff" />
      <stop offset="0.2" stop-color="#d75fd7" />
      <stop offset="0.42" stop-color="#af5fff" />
      <stop offset="0.6" stop-color="#5fafff" />
      <stop offset="0.82" stop-color="#00d7ff" />
      <stop offset="1" stop-color="#00ffff" />
    </linearGradient>

    
    <linearGradient id="ringGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5fff" />
      <stop offset="0.5" stop-color="#af5fff" />
      <stop offset="1" stop-color="#00ffff" />
    </linearGradient>

    
    <filter id="wordGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="b1" />
      <feFlood flood-color="#c860ff" flood-opacity="0.6" />
      <feComposite in2="b1" operator="in" result="g1" />
      <feGaussianBlur in="SourceAlpha" stdDeviation="20" result="b2" />
      <feFlood flood-color="#ff5fff" flood-opacity="0.32" />
      <feComposite in2="b2" operator="in" result="g2" />
      <feMerge>
        <feMergeNode in="g2" />
        <feMergeNode in="g1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b" />
      <feFlood flood-color="#af5fff" flood-opacity="0.5" />
      <feComposite in2="b" operator="in" result="g" />
      <feMerge><feMergeNode in="g" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  
  <g clip-path="url(#disc)">
    
    <rect width="800" height="800" fill="url(#baseField)" />
    <rect width="800" height="800" fill="url(#warmGlow)" />
    <rect width="800" height="800" fill="url(#coolGlow)" />
    
    <rect width="800" height="800" fill="url(#grid)" mask="url(#floorMask)" />

    
