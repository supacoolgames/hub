    <rect width="800" height="800" fill="url(#scan)" />
  </g>

  
  <g filter="url(#ringGlow)">
    <circle cx="400" cy="400" r="384" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-opacity="0.9" />
    <circle cx="400" cy="400" r="372" fill="none" stroke="#00d7ff" stroke-width="1.5" stroke-opacity="0.5" />
  </g>
</svg>